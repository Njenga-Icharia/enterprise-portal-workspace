<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g opacity="0.09" stroke="#ffffff" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- ring with center dot -->
    <circle cx="150" cy="150" r="55"/>
    <circle cx="150" cy="150" r="18" fill="#ffffff" stroke="none"/>

    <!-- organic blob -->
    <path d="M430 150 C470 90 580 90 620 150 C660 215 600 280 530 270 C460 262 390 215 430 150 Z"/>
    <circle cx="525" cy="180" r="14" fill="#ffffff" stroke="none"/>

