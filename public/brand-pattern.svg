    <!-- bottom-right ring -->
    <circle cx="725" cy="725" r="38" stroke-width="14"/>
    <circle cx="725" cy="725" r="12" fill="#ffffff" stroke="none"/>

    <!-- scattered dots -->
    <g fill="#ffffff" stroke="none">
      <circle cx="270" cy="90" r="12"/>
      <circle cx="320" cy="170" r="9"/>
      <circle cx="60" cy="470" r="11"/>
      <circle cx="420" cy="400" r="9"/>
      <circle cx="760" cy="330" r="12"/>
      <circle cx="450" cy="610" r="12"/>
      <circle cx="330" cy="760" r="10"/>
      <circle cx="90" cy="250" r="9"/>
      <circle cx="610" cy="520" r="9"/>
      <circle cx="740" cy="520" r="11"/>
      <circle cx="40" cy="620" r="9"/>
      <circle cx="590" cy="60" r="9"/>
    </g>
  </g>
</svg>
