      <ellipse cx="200" cy="560" rx="52" ry="30"/>
    </g>
    <circle cx="200" cy="560" r="10" fill="#ffffff" stroke="none"/>

    <!-- rounded triangle -->
    <path d="M520 570 L645 590 L590 700 Z"/>

    <!-- dash group -->
    <path d="M530 380 L690 365"/>
    <path d="M545 415 L705 405"/>
    <path d="M540 450 L660 455"/>

    <!-- long swoosh -->
    <path d="M70 720 C160 630 300 770 410 680"/>

    <!-- small loop -->
