<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Window Background -->
  <rect x="20" y="30" width="160" height="150" rx="10" fill="#e8ebe9" />
  
  <!-- Top Bar -->
  <path d="M 20,40 A 10,10 0 0 1 30,30 L 170,30 A 10,10 0 0 1 180,40 L 180,60 L 20,60 Z" fill="#595278" />
  
  <!-- Window Dots -->
  <circle cx="140" cy="45" r="4" fill="#113A5C" />
  <circle cx="155" cy="45" r="4" fill="#0072BC" />
  <circle cx="170" cy="45" r="4" fill="#fa7d38" />

  <!-- API Text -->
  <text x="100" y="115" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#fa7d38" text-anchor="middle">API</text>

  <!-- Left Gear (Blue) -->
  <g transform="translate(40, 140)">
    <circle cx="0" cy="0" r="10" fill="#fff" />
    <circle cx="0" cy="0" r="5" fill="#0072BC" />
    <path d="M -8,-22 L 8,-22 L 10,-12 L 20,-20 L 28,-8 L 18,0 L 28,8 L 20,20 L 10,12 L 8,22 L -8,22 L -10,12 L -20,20 L -28,8 L -18,0 L -28,-8 L -20,-20 L -10,-12 Z" fill="#0072BC" />
  </g>

  <!-- Right Gear (Orange) -->
  <g transform="translate(160, 140)">
    <circle cx="0" cy="0" r="10" fill="#fff" />
    <circle cx="0" cy="0" r="5" fill="#fa7d38" />
    <path d="M -8,-22 L 8,-22 L 10,-12 L 20,-20 L 28,-8 L 18,0 L 28,8 L 20,20 L 10,12 L 8,22 L -8,22 L -10,12 L -20,20 L -28,8 L -18,0 L -28,-8 L -20,-20 L -10,-12 Z" fill="#fa7d38" />
  </g>

  <!-- Center Arrows (Dark Blue) -->
  <g fill="#113A5C">
    <!-- Left Arrow -->
    <polygon points="60,115 85,115 85,105 105,125 85,145 85,135 60,135" />
    <!-- Right Arrow -->
    <polygon points="140,115 115,115 115,105 95,125 115,145 115,135 140,135" />
  </g>
</svg>