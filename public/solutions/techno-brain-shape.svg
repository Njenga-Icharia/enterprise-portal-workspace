<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 464" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Purple (bottom right) -->
  <polygon id="hex-purple" fill="#595278"
    points="290,132.24 428.56,212.24 428.56,372.24 290,452.24 151.44,372.24 151.44,212.24"/>

  <!-- Orange (top), over purple -->
  <polygon id="hex-orange" fill="#fa7d38"
    points="220,11 358.56,91 358.56,251 220,331 81.44,251 81.44,91"/>

  <!-- Blue (bottom left), over orange but under purple: drawn as blue minus purple -->
  <polygon id="hex-blue" fill="#0072bc"
    points="150,132.24 220,172.65 151.44,212.24 151.44,372.24 220,411.83 150,452.24 11.44,372.24 11.44,212.24"/>

  <!-- Center hexagon = exact area where all three overlap -->
  <polygon id="hex-center" fill="#ffffff"
    points="220,172.65 288.56,212.24 288.56,291.42 220,331 151.44,291.42 151.44,212.24"/>
</svg>
