    <!-- Top -->
    <g transform="translate(60, 10)">
      <rect x="0" y="0" width="80" height="45" rx="4" />
      <line x1="15" y1="15" x2="65" y2="15" stroke-linecap="round" />
      <line x1="15" y1="25" x2="65" y2="25" stroke-linecap="round" />
      <line x1="15" y1="35" x2="65" y2="35" stroke-linecap="round" />
    </g>
    <!-- Bottom -->
    <g transform="translate(60, 145)">
      <rect x="0" y="0" width="80" height="45" rx="4" />
      <line x1="15" y1="15" x2="65" y2="15" stroke-linecap="round" />
      <line x1="15" y1="25" x2="65" y2="25" stroke-linecap="round" />
      <line x1="15" y1="35" x2="65" y2="35" stroke-linecap="round" />
    </g>
    <!-- Left -->
    <g transform="translate(10, 60)">
      <rect x="0" y="0" width="45" height="80" rx="4" />
      <line x1="10" y1="20" x2="35" y2="20" stroke-linecap="round" />
      <line x1="10" y1="35" x2="35" y2="35" stroke-linecap="round" />
