      <rect x="0" y="0" width="45" height="80" rx="4" />
      <line x1="10" y1="20" x2="35" y2="20" stroke-linecap="round" />
      <line x1="10" y1="35" x2="35" y2="35" stroke-linecap="round" />
      <line x1="10" y1="50" x2="35" y2="50" stroke-linecap="round" />
      <line x1="10" y1="65" x2="35" y2="65" stroke-linecap="round" />
    </g>
